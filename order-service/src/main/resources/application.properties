
spring.application.name=order-service

server.port=8083

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/ecommerce_order_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/api

# Circuit Breaker
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2

# Timeout
resilience4j.timelimiter.instances.paymentService.timeout-duration=3s

# Retry
resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=5s

# Feign Timeout
spring.cloud.openfeign.client.config.payment-service.connectTimeout=2000
spring.cloud.openfeign.client.config.payment-service.readTimeout=3000

# Rate Limit
resilience4j.ratelimiter.instances.order-service.limit-for-period=5
resilience4j.ratelimiter.instances.order-service.limit-refresh-period=10s
resilience4j.ratelimiter.instances.order-service.timeout-duration=0

# Bulkhead
resilience4j.bulkhead.instances.paymentService.max-concurrent-calls=5
resilience4j.bulkhead.instances.paymentService.max-wait-duration=0

# Eureka
eureka.client.service-url.defaultZone=http://host.docker.internal:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Kafka Producer
spring.kafka.bootstrap-servers=host.docker.internal:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=orderEvent:com.Ecommerce.order_service.event.OrderCreatedEvent

# Kafka Consumer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.Ecommerce.order_service.event
spring.kafka.consumer.properties.spring.json.type.mapping=paymentSuccess:com.Ecommerce.order_service.event.PaymentSucceededEvent,paymentFailed:com.Ecommerce.order_service.event.PaymentFailedEvent

eureka.instance.prefer-ip-address=true

# Internal service authentication
app.internal-service.token=${INTERNAL_SERVICE_TOKEN}
app.jwt.secret=${JWT_SECRET}
