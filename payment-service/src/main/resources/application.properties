spring.application.name=payment-service

server.port=8084

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/ecommerce_payment_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/api

# Eureka
eureka.client.service-url.defaultZone=http://host.docker.internal:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Kafka
spring.kafka.bootstrap-servers=host.docker.internal:29092
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.Ecommerce.payment_service.event
spring.kafka.consumer.properties.spring.json.type.mapping=orderEvent:com.Ecommerce.payment_service.event.OrderCreatedEvent

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.properties.spring.json.type.mapping=paymentSuccess:com.Ecommerce.payment_service.event.PaymentSucceededEvent,paymentFailed:com.Ecommerce.payment_service.event.PaymentFailedEvent

eureka.instance.prefer-ip-address=true
app.jwt.secret=${JWT_SECRET}
app.internal-service.token=${INTERNAL_SERVICE_TOKEN}

logging.level.org.springframework.security=TRACE
